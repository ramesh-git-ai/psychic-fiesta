name: build-test-deploy-workflow
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run test
 deploy:
    needs: test

    permissions: 
      contents: write
      pages: write
      id-token: write

    environment: 
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: configure github pages
        uses: actions/configure-pages@v4
        with: 
         stactic_site_generator: next
      - run: npm install
      - run: npm run build
      - name: upload artifacts
        use: actiona/upload-pages-artifcat@v3
        with: 
         path: './out'
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
       
